<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-labelledby="title desc">
  <title id="title">Embodied Skill Replacement Architecture</title>
  <desc id="desc">Left-to-right pipeline: Observation input, heterogeneous Foundation Models, Decision-Compatible Adapter, Unified Skill Representation, SkillChannel gate, Pretrained Brain, and action outputs. A skill-call feedback path returns from Scheduler to SkillChannel.</desc>

  <defs>
    <!-- Color encodes GROUP only (framework: do not use colour for aesthetics) -->
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1.5 L9,5 L0,8.5 Z" fill="#334155"/>
    </marker>
    <marker id="arrDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1.5 L9,5 L0,8.5 Z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect width="1180" height="560" fill="#FFFFFF"/>

  <!-- title -->
  <text x="590" y="36" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F172A">Embodied Skill Replacement Architecture</text>
  <text x="590" y="56" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#64748B">Contract Mismatch  -&gt;  Decision-Compatible Adapter  -&gt;  USR  -&gt;  SkillChannel  -&gt;  Decision-Aware Brain</text>

  <!-- ========== INPUT ========== -->
  <g>
    <rect x="24" y="200" width="88" height="120" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="68" y="248" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Input</text>
    <text x="68" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#475569">RGB</text>
    <text x="68" y="286" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#475569">instruction</text>
    <text x="68" y="302" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#475569">history</text>
  </g>

  <path d="M112 260 H140" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ========== COL 1: Foundation Models ========== -->
  <g>
    <!-- group band: same-role modules share one fill -->
    <rect x="140" y="96" width="168" height="328" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.4"/>
    <text x="224" y="118" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1E3A8A">1  Foundation Models</text>
    <text x="224" y="134" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#3B82F6">heterogeneous / replaceable</text>

    <rect x="156" y="150" width="136" height="70" rx="6" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.2"/>
    <text x="224" y="174" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1E3A8A">OG</text>
    <text x="224" y="192" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#334155">LLMDet / GDINO</text>
    <text x="224" y="208" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#64748B">object grounding</text>

    <rect x="156" y="234" width="136" height="70" rx="6" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.2"/>
    <text x="224" y="258" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1E3A8A">SD</text>
    <text x="224" y="276" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#334155">Florence-2</text>
    <text x="224" y="292" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#64748B">spatial / scene</text>

    <rect x="156" y="318" width="136" height="70" rx="6" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.2"/>
    <text x="224" y="342" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1E3A8A">EG</text>
    <text x="224" y="360" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#334155">Qwen-EG / eg-LoRA</text>
    <text x="224" y="376" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#64748B">independent skill</text>
  </g>

  <path d="M308 260 H336" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ========== COL 2: Adapter ========== -->
  <g>
    <rect x="336" y="96" width="168" height="328" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.4"/>
    <text x="420" y="118" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#065F46">2  Decision-Compatible</text>
    <text x="420" y="134" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#065F46">Adapter</text>

    <rect x="352" y="160" width="136" height="88" rx="6" fill="#FFFFFF" stroke="#34D399" stroke-width="1.2"/>
    <text x="420" y="186" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#065F46">remap v3 (OG)</text>
    <text x="420" y="206" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#334155">canonicalize</text>
    <text x="420" y="222" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#334155">functional override</text>
    <text x="420" y="238" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#64748B">no-veto / found / fallback</text>

    <rect x="352" y="264" width="136" height="58" rx="6" fill="#FFFFFF" stroke="#34D399" stroke-width="1.2"/>
    <text x="420" y="288" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#065F46">SD parse</text>
    <text x="420" y="308" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#334155">object -&gt; loc / relation</text>

    <rect x="352" y="338" width="136" height="58" rx="6" fill="#FFFFFF" stroke="#34D399" stroke-width="1.2"/>
    <text x="420" y="362" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#065F46">EG parse + validator</text>
    <text x="420" y="382" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#334155">in | on | target &lt;obj&gt;</text>
  </g>

  <path d="M504 260 H532" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ========== COL 3: USR ========== -->
  <g>
    <rect x="532" y="96" width="176" height="328" rx="10" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.4"/>
    <text x="620" y="118" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#9A3412">3  USR v2.0</text>
    <text x="620" y="134" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#EA580C">typed / temporal / auditable</text>

    <rect x="548" y="152" width="144" height="52" rx="6" fill="#FFFFFF" stroke="#FB923C" stroke-width="1.2"/>
    <text x="620" y="174" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9A3412">environment_facts</text>
    <text x="620" y="192" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#64748B">object.class / relation / loc</text>

    <rect x="548" y="214" width="144" height="52" rx="6" fill="#FFFFFF" stroke="#FB923C" stroke-width="1.2"/>
    <text x="620" y="236" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9A3412">task_semantics</text>
    <text x="620" y="254" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#64748B">subgoal / role</text>

    <rect x="548" y="276" width="144" height="52" rx="6" fill="#FFFFFF" stroke="#FB923C" stroke-width="1.2"/>
    <text x="620" y="298" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9A3412">decision_signals</text>
    <text x="620" y="316" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#64748B">found / conf / uncertainty</text>

    <rect x="548" y="338" width="144" height="52" rx="6" fill="#FFFFFF" stroke="#FB923C" stroke-width="1.2"/>
    <text x="620" y="360" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9A3412">provenance</text>
    <text x="620" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#64748B">detector / alignment_path</text>
  </g>

  <path d="M708 260 H736" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="722" y="248" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#475569">publish</text>

  <!-- ========== COL 4: SkillChannel ========== -->
  <g>
    <rect x="736" y="96" width="168" height="328" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/>
    <text x="820" y="118" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0F172A">4  SkillChannel</text>
    <text x="820" y="134" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#475569">gate / audit / isolation</text>

    <rect x="752" y="160" width="136" height="64" rx="6" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
    <text x="820" y="186" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0F172A">publish(skill, USR)</text>
    <text x="820" y="206" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#64748B">schema / producer / ids</text>

    <rect x="752" y="240" width="136" height="72" rx="6" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
    <text x="820" y="266" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0F172A">consume(public_field)</text>
    <text x="820" y="284" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#64748B">PUBLIC_FIELDS only</text>
    <text x="820" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#B91C1C">raw output BLOCKED</text>

    <rect x="752" y="328" width="136" height="64" rx="6" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
    <text x="820" y="354" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0F172A">contract audit</text>
    <text x="820" y="374" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#64748B">temporal isolation</text>
  </g>

  <path d="M904 240 H932" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M904 280 H932" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="918" y="228" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#475569">consume</text>

  <!-- ========== COL 5: Brain ========== -->
  <g>
    <rect x="932" y="96" width="168" height="220" rx="10" fill="#111827" stroke="#111827" stroke-width="1.4"/>
    <text x="1016" y="120" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">5  Pretrained Brain</text>
    <text x="1016" y="136" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#94A3B8">fine-tuned Qwen2.5-VL-3B</text>

    <rect x="948" y="152" width="136" height="64" rx="6" fill="#1F2937" stroke="#9CA3AF" stroke-width="1.1"/>
    <text x="1016" y="178" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">Scheduler</text>
    <text x="1016" y="198" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#CBD5E1">Think -&gt; Query</text>

    <rect x="948" y="230" width="136" height="64" rx="6" fill="#1F2937" stroke="#9CA3AF" stroke-width="1.1"/>
    <text x="1016" y="256" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">LPM / decoder</text>
    <text x="1016" y="276" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#CBD5E1">action policy</text>
  </g>

  <!-- Brain -> Output -->
  <path d="M1016 316 V348" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ========== OUTPUT ========== -->
  <g>
    <rect x="948" y="352" width="136" height="72" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="1016" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Output</text>
    <text x="1016" y="398" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#475569">execute / guard</text>
    <text x="1016" y="414" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#475569">/ reobserve</text>
  </g>

  <!-- skill-call feedback: Scheduler -> SkillChannel (ONE dashed style for control, solid for data) -->
  <path d="M948 184 C900 184, 900 450, 820 450 C820 450, 820 430, 820 424" fill="none" stroke="#64748B" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrDash)"/>
  <text x="860" y="468" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#64748B">skill call (control)</text>

  <!-- legend -->
  <g>
    <text x="24" y="470" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Visual encoding</text>
    <rect x="24" y="484" width="14" height="14" rx="2" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="44" y="495" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#334155">skill backends (FM)</text>
    <rect x="170" y="484" width="14" height="14" rx="2" fill="#ECFDF5" stroke="#6EE7B7"/>
    <text x="190" y="495" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#334155">contract adapter</text>
    <rect x="310" y="484" width="14" height="14" rx="2" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="330" y="495" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#334155">shared representation</text>
    <rect x="470" y="484" width="14" height="14" rx="2" fill="#F1F5F9" stroke="#64748B"/>
    <text x="490" y="495" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#334155">communication gate</text>
    <rect x="620" y="484" width="14" height="14" rx="2" fill="#111827" stroke="#111827"/>
    <text x="640" y="495" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#334155">frozen Brain</text>
    <line x1="740" y1="491" x2="768" y2="491" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="776" y="495" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#334155">data / USR flow</text>
    <line x1="880" y1="491" x2="908" y2="491" stroke="#64748B" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrDash)"/>
    <text x="916" y="495" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#334155">control (skill call)</text>
  </g>

  <text x="590" y="540" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#94A3B8">Reading order: left -&gt; right. Color encodes role group only. Solid = information flow; dashed = control.</text>
</svg>
