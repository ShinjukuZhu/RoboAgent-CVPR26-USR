    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 Z" fill="#64748B"/>
    </marker>
    <marker id="arrowLight" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8.5 5 L 0 8.8 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="980" height="980" rx="18" fill="url(#bg)"/>
  <rect x="18" y="18" width="944" height="944" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

