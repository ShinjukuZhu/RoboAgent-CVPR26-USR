<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="980" viewBox="0 0 980 980" role="img" aria-labelledby="title desc">
  <title id="title">RoboAgent Skill Architecture</title>
  <desc id="desc">Foundation Models flow through Skill Logic and Decision-Aware Adapter into Unified Skill Representation, gated by SkillChannel, then consumed by the pretrained Brain.</desc>

  <defs>
