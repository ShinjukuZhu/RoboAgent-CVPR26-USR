  <text x="490" y="82" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748B">Heterogeneous FMs  -&gt;  Adapter  -&gt;  USR  -&gt;  SkillChannel  -&gt;  Pretrained Brain</text>

